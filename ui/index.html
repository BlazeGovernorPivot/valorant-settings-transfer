<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ValSync</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="window">
    <header class="titlebar" data-tauri-drag-region>
      <div class="tb-brand" data-tauri-drag-region>
        <span class="tb-logo"></span>
        <span class="tb-name">ValSync</span>
      </div>
      <div class="tb-status" id="tb-status" data-tauri-drag-region></div>
      <div class="caption">
        <button class="cap" data-win="minimize" aria-label="Minimize"><svg width="10" height="10"><path d="M0 5.5h10" stroke="currentColor"/></svg></button>
        <button class="cap" data-win="toggleMaximize" aria-label="Maximize"><svg width="10" height="10"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button>
        <button class="cap cap-close" data-win="close" aria-label="Close"><svg width="10" height="10"><path d="M.5.5l9 9M9.5.5l-9 9" stroke="currentColor"/></svg></button>
      </div>
    </header>
    <div class="shell">
      <nav class="sidebar" id="sidebar"></nav>
      <main class="main" id="main"></main>
    </div>
    <div id="toast" class="toast"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
